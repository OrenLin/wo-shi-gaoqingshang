<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>万有引力 · 黑洞 GARGANTUA</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='9' fill='black' stroke='orange' stroke-width='3'/></svg>">
<style>
:root {
    --accent: #ffa94d;
    --fg: #e8e4da;
    --bg: rgba(10, 10, 14, 0.72);
    --border: rgba(255, 169, 77, 0.25);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
body {
    font-family: "Segoe UI", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    color: var(--fg);
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
}
#gl { position: fixed; inset: 0; display: block; width: 100vw; height: 100vh; }

/* ---------- 顶部标题（精简，可隐藏） ---------- */
#hud-top {
    position: fixed; top: 14px; left: 16px; z-index: 5;
    text-shadow: 0 1px 6px #000; pointer-events: none;
    transition: opacity .3s;
}
#hud-top h1 {
    font-size: 20px; letter-spacing: 0.3em; font-weight: 300; color: var(--accent);
}
#hud-top .sub { font-size: 10px; letter-spacing: 0.15em; opacity: 0.7; margin-top: 2px; }
#hud-top .stats { font-size: 10px; font-variant-numeric: tabular-nums; opacity: 0.75; margin-top: 6px; }

/* ---------- 底部控制面板 ---------- */
#dock {
    position: fixed; left: 50%; bottom: 52px; transform: translateX(-50%);
    z-index: 6; width: min(94vw, 560px);
    background: linear-gradient(180deg, rgba(10,10,14,0.55), rgba(10,10,14,0.82));
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--border); border-radius: 14px;
    padding: 10px 12px 12px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    transition: opacity .3s, transform .3s;
}
#dock.collapsed { opacity: 0; transform: translateX(-50%) translateY(20px); pointer-events: none; }

.dock-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.dock-row + .dock-row { margin-top: 7px; padding-top: 7px; border-top: 1px solid rgba(255,169,77,0.12); }
.dock-label {
    font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--accent); opacity: 0.8; margin-right: 4px; font-weight: 600;
    flex: 0 0 auto;
}
button {
    flex: 1 1 auto; min-width: 44px;
    background: rgba(255, 169, 77, 0.08);
    border: 1px solid var(--border);
    color: var(--fg); font-size: 11px; padding: 7px 8px;
    border-radius: 7px; cursor: pointer; white-space: nowrap;
    transition: background .15s, transform .1s;
}
button:hover { background: rgba(255, 169, 77, 0.22); }
button:active { transform: scale(0.94); }
button.active { background: var(--accent); color: #14100a; font-weight: 600; }
button.primary { background: var(--accent); color: #14100a; font-weight: 600; }
button.primary:hover { background: #ffbf6e; }
button.icon { flex: 0 0 auto; min-width: 40px; padding: 7px 10px; }

/* ---------- 折叠按钮 ---------- */
#toggle-dock {
    position: fixed; right: 14px; bottom: 52px; z-index: 7;
    width: 38px; height: 38px; border-radius: 50%;
    background: rgba(10,10,14,0.72); border: 1px solid var(--border);
    color: var(--accent); font-size: 16px; cursor: pointer;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center;
    transition: transform .2s;
}
#toggle-dock:active { transform: scale(0.9); }

/* ---------- 底部 TAB 栏：万有引力 ---------- */
#tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 8;
    height: 44px; padding: 0 12px env(safe-area-inset-bottom, 0);
    background: linear-gradient(180deg, rgba(10,10,14,0.6), rgba(0,0,0,0.92));
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid rgba(255,169,77,0.18);
    display: flex; align-items: center; gap: 8px;
}
.tab-cat {
    font-size: 10px; letter-spacing: 0.2em; color: var(--accent);
    opacity: 0.85; font-weight: 600; padding: 0 6px;
    flex: 0 0 auto;
}
.tab-pills { display: flex; gap: 6px; flex: 1 1 auto; overflow-x: auto; }
.tab-pill {
    flex: 0 0 auto;
    display: inline-flex; align-items: center; gap: 4px;
    padding: 5px 11px; border-radius: 999px;
    background: rgba(255,169,77,0.08); border: 1px solid var(--border);
    color: var(--fg); font-size: 11px; cursor: pointer;
    white-space: nowrap; transition: all .15s;
}
.tab-pill.active { background: var(--accent); color: #14100a; font-weight: 600; }
.tab-pill:not(.active) { opacity: 0.65; }
.tab-pill:not(.active):hover { opacity: 1; background: rgba(255,169,77,0.18); }
.tab-more {
    font-size: 9px; color: var(--fg); opacity: 0.4; padding: 0 6px;
    flex: 0 0 auto; font-style: italic;
}

/* ---------- overlay toast ---------- */
#overlay {
    position: fixed; left: 50%; bottom: 110px; transform: translateX(-50%);
    z-index: 20; padding: 9px 20px; border-radius: 8px;
    background: var(--bg); border: 1px solid var(--border);
    font-size: 12px; letter-spacing: 0.05em;
    opacity: 0; pointer-events: none; transition: opacity .35s;
    max-width: 80vw; text-align: center;
}
#overlay.visible { opacity: 1; }

/* ---------- 隐藏的必要元素（gargantua/main 需要） ---------- */
#params, #diag { display: none !important; }
#ship-modal { display: none !important; }

/* ---------- UI 隐藏（沉浸模式） ---------- */
body.ui-hidden #hud-top, body.ui-hidden #dock, body.ui-hidden #toggle-dock { opacity: 0; pointer-events: none; }
body.ui-hidden #tabbar { opacity: 0.4; }
body.ui-hidden #overlay { opacity: 0 !important; }

/* ---------- 加载提示 ---------- */
#boot {
    position: fixed; inset: 0; z-index: 100;
    background: #000; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 14px;
    transition: opacity .6s; color: var(--accent);
}
#boot.done { opacity: 0; pointer-events: none; }
#boot .ring {
    width: 46px; height: 46px; border-radius: 50%;
    border: 2px solid rgba(255,169,77,0.2); border-top-color: var(--accent);
    animation: spin 1s linear infinite;
}
#boot .txt { font-size: 11px; letter-spacing: 0.3em; opacity: 0.7; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- 移动端 ---------- */
@media (max-width: 480px) {
    #hud-top h1 { font-size: 16px; }
    #hud-top .stats { display: none; }
    #dock { bottom: 50px; padding: 8px 10px 10px; }
    button { padding: 8px 6px; font-size: 10px; }
    .dock-label { display: none; }
}
</style>
</head>
<body>
<canvas id="gl"></canvas>

<!-- 加载提示 -->
<div id="boot">
    <div class="ring"></div>
    <div class="txt">GARGANTUA · 引力场计算中</div>
</div>

<!-- 顶部标题 -->
<header id="hud-top">
    <h1>GARGANTUA</h1>
    <p class="sub">史瓦西黑洞 · 实时光线追踪</p>
    <p class="stats">
        <span id="fps">60</span> 帧 · <span id="res">–</span> ·
        <span id="steps">–</span> 步 · <span id="qual">–</span> ·
        <span id="debugLabel">调试 0</span>
    </p>
</header>

<!-- 隐藏的必要容器（gargantua/main 需要绑定，但用户不可见） -->
<div id="params" hidden></div>
<div id="diag" hidden></div>
<div id="ship-modal" class="modal hidden"></div>

<!-- 底部控制面板 -->
<div id="dock">
    <div class="dock-row">
        <span class="dock-label">画质</span>
        <div id="quality" style="display:contents">
            <button data-q="standard">标准</button>
            <button data-q="high">高清</button>
            <button data-q="cinematic">影院</button>
        </div>
    </div>
    <div class="dock-row">
        <span class="dock-label">视角</span>
        <div id="presets" style="display:contents">
            <button>视界</button>
            <button>极区</button>
            <button>光子环</button>
            <button>深场</button>
        </div>
    </div>
    <div class="dock-row">
        <button id="bestBtn" class="primary">★ 最佳</button>
        <button id="cineBtn" class="icon">🎬</button>
        <button id="musicBtn" class="icon">♪</button>
        <button id="shotBtn" class="icon">📷</button>
        <button id="resetBtn" class="icon">↺</button>
        <button id="hideBtn" class="icon" title="隐藏界面 (H)">👁</button>
    </div>
</div>

<!-- 折叠/展开按钮 -->
<button id="toggle-dock" title="显示控制">⚙</button>

<!-- 底部 TAB 栏：万有引力 -->
<nav id="tabbar">
    <span class="tab-cat">🪐 万有引力</span>
    <div class="tab-pills">
        <span class="tab-pill active">🕳️ 黑洞</span>
        <span class="tab-more">更多工具即将上线</span>
    </div>
</nav>

<!-- toast -->
<div id="overlay" role="alert"></div>

<script type="module">
import 'gargantua/main';

// 启动后：隐藏加载提示 + 自动应用最佳视觉预设
function bootReady() {
    const boot = document.getElementById('boot');
    if (boot) { boot.classList.add('done'); setTimeout(() => boot.remove(), 700); }
    // 自动应用最佳预设，让用户开箱即看最佳效果
    const best = document.getElementById('bestBtn');
    if (best) best.click();
}
// 等待 gargantua/main 的 boot() 完成（同步执行，import 返回即完成）
requestAnimationFrame(() => setTimeout(bootReady, 80));

// 折叠/展开控制面板
const dock = document.getElementById('dock');
const toggleDock = document.getElementById('toggle-dock');
let dockCollapsed = false;
function toggleDockPanel() {
    dockCollapsed = !dockCollapsed;
    dock.classList.toggle('collapsed', dockCollapsed);
    toggleDock.textContent = dockCollapsed ? '⚙' : '⚙';
}
toggleDock.addEventListener('click', toggleDockPanel);

// 隐藏界面（沉浸模式）
const hideBtn = document.getElementById('hideBtn');
if (hideBtn) hideBtn.addEventListener('click', () => document.body.classList.toggle('ui-hidden'));
// 双击画布切换沉浸模式
document.getElementById('gl').addEventListener('dblclick', () => document.body.classList.toggle('ui-hidden'));

// 移动端：默认折叠参数面板，专注看宇宙
if (matchMedia('(pointer: coarse)').matches || innerWidth < 720) {
    setTimeout(() => { if (!dockCollapsed) toggleDockPanel(); }, 1500);
}
</script>
</body>
</html>
