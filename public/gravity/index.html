<style>
:root {
    --accent: #ffa94d;
    --fg: #e8e4da;
    --bg: rgba(8, 8, 12, 0.78);
    --border: rgba(255, 169, 77, 0.22);

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
body {
    font-family: "PingFang SC", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    color: var(--fg);
    -webkit-user-select: none; user-select: none;
    touch-action: none;
}
#gl { position: fixed; inset: 0; display: block; width: 100vw; height: 100vh; touch-action: none; }

#hud-top {
    position: fixed; top: max(12px, env(safe-area-inset-top)); left: 16px; z-index: 5;
    text-shadow: 0 1px 6px #000; pointer-events: none;
    transition: opacity .4s;
}
#hud-top h1 { font-size: 18px; letter-spacing: 0.32em; font-weight: 300; color: var(--accent); }
#hud-top .sub { font-size: 9px; letter-spacing: 0.18em; opacity: 0.65; margin-top: 2px; }
#hud-top .stats { font-size: 9px; font-variant-numeric: tabular-nums; opacity: 0.55; margin-top: 5px; }

#back-btn {
    position: fixed; top: max(12px, env(safe-area-inset-top)); right: 16px; z-index: 9;
    width: 38px; height: 38px; border-radius: 50%;
    background: rgba(8,8,12,0.78); border: 1px solid var(--border);
    color: var(--accent); font-size: 18px; cursor: pointer;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    display: flex; align-items: center; justify-content: center;
    transition: transform .2s; box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    text-decoration: none;
}
#back-btn:active { transform: scale(0.88); }

#dock {
    position: fixed; left: 50%; bottom: 16px;
    transform: translateX(-50%); z-index: 6;
    width: min(94vw, 520px);
    background: linear-gradient(180deg, rgba(8,8,12,0.6), rgba(8,8,12,0.88));
    backdrop-filter: blur(14px) saturate(140%); -webkit-backdrop-filter: blur(14px) saturate(140%);
    border: 1px solid var(--border); border-radius: 16px;
    padding: 9px 11px 11px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.04);
    transition: opacity .35s, transform .35s cubic-bezier(0.22, 1, 0.36, 1);
}
#dock.collapsed { opacity: 0; transform: translateX(-50%) translateY(24px) scale(0.96); pointer-events: none; }

.dock-row { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
.dock-row + .dock-row { margin-top: 6px; padding-top: 6px; border-top: 1px solid rgba(255,169,77,0.1); }
.dock-label {
    font-size: 8px; letter-spacing: 0.24em; text-transform: uppercase;
    color: var(--accent); opacity: 0.7; margin-right: 3px; font-weight: 600; flex: 0 0 auto;
}
button {
    flex: 1 1 auto; min-width: 40px;
    background: rgba(255, 169, 77, 0.07); border: 1px solid var(--border);
    color: var(--fg); font-size: 11px; padding: 8px 7px;
    border-radius: 8px; cursor: pointer; white-space: nowrap;
    transition: background .15s, transform .12s; touch-action: manipulation;
}
button:hover { background: rgba(255, 169, 77, 0.2); }
button:active { transform: scale(0.92); background: rgba(255, 169, 77, 0.3); }
button.active { background: var(--accent); color: #14100a; font-weight: 700; }
button.primary { background: var(--accent); color: #14100a; font-weight: 700; box-shadow: 0 0 12px rgba(255,169,77,0.3); }
button.primary:hover { background: #ffbf6e; }
button.icon { flex: 0 0 auto; min-width: 38px; padding: 8px 9px; font-size: 13px; }

#toggle-dock {
    position: fixed; right: 14px; bottom: 16px; z-index: 7;
    width: 40px; height: 40px; border-radius: 50%;
    background: rgba(8,8,12,0.78); border: 1px solid var(--border);
    color: var(--accent); font-size: 17px; cursor: pointer;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    display: flex; align-items: center; justify-content: center;
    transition: transform .2s; box-shadow: 0 4px 16px rgba(0,0,0,0.4);
}
#toggle-dock:active { transform: scale(0.88); }

#gravity-tag {
    position: fixed; left: 14px; bottom: 18px; z-index: 6;
    display: inline-flex; align-items: center; gap: 5px;
    padding: 5px 10px; border-radius: 999px;
    background: rgba(8,8,12,0.72); border: 1px solid var(--border);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 10px; color: var(--accent); font-weight: 600; letter-spacing: 0.12em;
    pointer-events: none;
}
#gravity-tag .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 6px var(--accent); }

#overlay {
    position: fixed; left: 50%; bottom: 80px; transform: translateX(-50%);
    z-index: 20; padding: 8px 18px; border-radius: 8px;
    background: var(--bg); border: 1px solid var(--border);
    font-size: 12px; letter-spacing: 0.05em;
    opacity: 0; pointer-events: none; transition: opacity .35s;
    max-width: 80vw; text-align: center;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
#overlay.visible { opacity: 1; }

#params, #diag, #ship-modal { display: none !important; }

body.ui-hidden #hud-top, body.ui-hidden #dock, body.ui-hidden #toggle-dock, body.ui-hidden #gravity-tag { opacity: 0 !important; pointer-events: none; }
body.ui-hidden #overlay { opacity: 0 !important; }
body:not(.ui-hidden) #hud-top.idle { opacity: 0.35; }

/* 加载/错误界面 */
#boot {
    position: fixed; inset: 0; z-index: 100; background: #000;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 16px; transition: opacity .7s; color: var(--accent);
    padding: 20px; text-align: center;
}
#boot.done { opacity: 0; pointer-events: none; }
#boot.error { color: #ff6b6b; }
#boot .ring {
    width: 48px; height: 48px; border-radius: 50%;
    border: 2px solid rgba(255,169,77,0.18); border-top-color: var(--accent);
    animation: spin 1s linear infinite;
}
#boot.error .ring { border-top-color: #ff6b6b; animation: none; }
#boot .txt { font-size: 11px; letter-spacing: 0.2em; opacity: 0.7; line-height: 1.6; }
#boot .retry-btn {
    margin-top: 8px; padding: 10px 24px; border-radius: 8px;
    background: var(--accent); color: #14100a; border: none;
    font-size: 13px; font-weight: 700; cursor: pointer; letter-spacing: 0.1em;
}
#boot .retry-btn:active { transform: scale(0.95); }
#boot .err-detail {
    font-size: 10px; color: #ff6b6b; opacity: 0.8; margin-top: 4px;
    max-width: 90vw; word-break: break-all; font-family: monospace;

@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 480px) {
    #hud-top h1 { font-size: 15px; letter-spacing: 0.28em; }

    #dock { width: 92vw; padding: 8px 9px 10px; bottom: 14px; }
    button { padding: 9px 5px; font-size: 10px; }
    .dock-label { display: none; }
    #toggle-dock { width: 36px; height: 36px; font-size: 15px; bottom: 14px; }
    #gravity-tag { font-size: 9px; bottom: 16px; }
    #back-btn { width: 34px; height: 34px; font-size: 16px; }
}
</style>

<!-- 错误处理 + 超时降级 (在外部脚本, 不依赖模块加载) -->
<script>
window.__blackholeErrors = [];
window.addEventListener('error', (e) => {
    window.__blackholeErrors.push(e.message);
});
// 超时检测: 8秒未加载成功则显示错误
let bootTimer = setTimeout(() => {
    const boot = document.getElementById('boot');
    if (boot && !boot.classList.contains('done')) {
        showBootError('加载超时, 可能是网络或浏览器兼容问题', window.__blackholeErrors.slice(-3).join('; '));
    }
}, 8000);

function showBootError(msg, detail) {
    const boot = document.getElementById('boot');
    boot.classList.add('error');
    boot.querySelector('.ring').style.display = 'none';
    boot.querySelector('.txt').textContent = msg;
    const errEl = document.getElementById('boot-error');
    if (detail) { errEl.textContent = detail; errEl.hidden = false; }
    document.getElementById('retry-btn').hidden = false;
    clearTimeout(bootTimer);
}

function bootReady() {
    clearTimeout(bootTimer);
    const boot = document.getElementById('boot');
    if (boot) { boot.classList.add('done'); setTimeout(() => boot.remove(), 800); }
    const best = document.getElementById('bestBtn');
    if (best) best.click();
    if (matchMedia('(pointer: coarse)').matches || innerWidth < 720) {
        setTimeout(() => { if (!dockCollapsed) toggleDockPanel(); }, 1800);
    }
}

document.getElementById('retry-btn').addEventListener('click', () => location.reload());

// UI 控制 (不依赖 gargantua 模块)
const dock = document.getElementById('dock');
const toggleDock = document.getElementById('toggle-dock');
let dockCollapsed = false;
function toggleDockPanel() {
    dockCollapsed = !dockCollapsed;
    dock.classList.toggle('collapsed', dockCollapsed);
}
toggleDock.addEventListener('click', toggleDockPanel);

const hideBtn = document.getElementById('hideBtn');
if (hideBtn) hideBtn.addEventListener('click', () => document.body.classList.toggle('ui-hidden'));

let lastTap = 0;
const gl = document.getElementById('gl');
gl.addEventListener('touchend', (e) => {
    const now = Date.now();
    if (now - lastTap < 320 && e.changedTouches.length === 1) {
        document.body.classList.toggle('ui-hidden');
    }
    lastTap = now;
});
gl.addEventListener('dblclick', () => document.body.classList.toggle('ui-hidden'));

const hudTop = document.getElementById('hud-top');
let idleTimer = null;
function markActive() {
    hudTop.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => hudTop.classList.add('idle'), 2500);
}
['touchstart','touchmove','mousedown','wheel'].forEach(ev =>
    document.addEventListener(ev, markActive, { passive: true }));
markActive();

// 暴露 bootReady 给 gargantua/main 调用
window.__bootReady = bootReady;
</script>

    return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}
float fbm(vec2 p) {
    float s = 0.0, a = 0.5;
    for (int i = 0; i < 5; i++) {
        s += a * vnoise(p);
        p = p * 2.03 + vec2(17.3, 9.1);
        a *= 0.5;
    }
    return s;
}

// ------------------------------------------------------------------ stars --
vec3 starLayer(vec3 d, float freq, float power, float gain) {
    vec3 g  = d * freq;
    vec3 id = floor(g);
    vec3 f  = fract(g) - 0.5;
    vec3 r  = hash33(id) - 0.5;
    float dist = length(f - r * 0.85);
    float core = smoothstep(0.10, 0.0, dist);
    float mag  = pow(hash12(id.xy * 7.13 + id.z * 3.7), power);
    // subtle temperature variation per star
    vec3 tint = mix(vec3(1.0, 0.82, 0.62), vec3(0.72, 0.84, 1.0),
                    hash12(id.zx * 5.1 + id.y));
    return core * mag * gain * tint;
}
vec3 stars(vec3 d) {
    vec3 c = vec3(0.0);
    c += starLayer(d,  60.0, 14.0, 90.0);   // sparse bright stars
    c += starLayer(d, 140.0, 18.0, 55.0);   // dense faint field
    c += starLayer(d + 3.7, 26.0, 11.0, 40.0); // few hero stars
    return c;
}

// ----------------------------------------------------------------- galaxy --
vec3 galaxy(vec3 d) {
    vec3 n  = normalize(vec3(0.42, 1.0, 0.30));   // galactic normal (tilted)
    float band = exp(-pow(abs(dot(d, n)) * 7.5, 1.25));
    vec3 t1 = normalize(cross(n, vec3(1.0, 0.0, 0.0)));
    vec3 t2 = cross(n, t1);
    vec2 gc = vec2(dot(d, t1), dot(d, t2));
    float cl   = fbm(gc * 4.5 + 7.0);
    float cl2  = fbm(gc * 11.0 - 3.0);
    float dust = fbm(gc * 7.0 + 13.0);
    vec3 col = mix(vec3(0.05, 0.07, 0.14), vec3(0.72, 0.52, 0.34), cl * cl * 2.2);
    col *= 0.22 + 1.15 * cl2;
    col *= 1.0 - 0.65 * smoothstep(0.40, 0.72, dust);   // dark dust lanes
    col *= band * 0.55;
    col += vec3(0.50, 0.45, 0.40) * pow(band, 9.0) * 0.22; // bright core band
    return col;
}

vec3 background(vec3 d) {
    return stars(d) * uStarBright + galaxy(d) * uGalaxyBright
         + vec3(0.012, 0.014, 0.020);
}

// -------------------------------------------------------------- blackbody --
vec3 blackbody(float t) {
    vec3 c = mix(vec3(0.30, 0.02, 0.00), vec3(1.00, 0.36, 0.05), smoothstep(0.00, 0.55, t));
    c = mix(c, vec3(1.00, 0.86, 0.62), smoothstep(0.55, 1.05, t));
    c = mix(c, vec3(0.82, 0.92, 1.30), smoothstep(1.05, 1.95, t));
    return c;
}

// ------------------------------------------------------------ accretion ---
// Returns rgb + coverage alpha of the thin equatorial disk at hit point.
vec4 diskSample(vec3 hit, float rr) {
    float phi   = atan(hit.z, hit.x);
    float omega = pow(max(uRS / rr, 0.0), 1.5);              // Keplerian Ω ∝ r^-3/2
    float ang   = phi + uTime * uTurbSpeed * omega * 3.0;

    // logarithmic spiral pattern advected by differential rotation.
    // atan() has a branch cut at phi = ±π: sampling noise along 'spiral'
    // directly tears the pattern there (and differential rotation winds the
    // tear into a spiral over time). Embedding the phase on a circle via
    // cos/sin makes it continuous, provided the angular harmonics are whole
    // windings (3 and 8 here).
    float spiral  = ang * 3.0 + 6.0  * log(rr / uDiskInner + 1.0);
    float spiral2 = ang * 8.0 + 16.2 * log(rr / uDiskInner + 1.0);
    vec2 sc1 = vec2(cos(spiral),  sin(spiral));
    vec2 sc2 = vec2(cos(spiral2), sin(spiral2));
    float n1 = fbm(sc1 * 1.8 + vec2(0.0, rr * 3.0 - uTime * uTurbSpeed * 0.45));
    float n2 = fbm(sc2 * 2.2 + vec2(31.0, rr * 7.0 + 5.0));
    float dens = clamp(n1 * 0.72 + n2 * 0.55 - 0.22, 0.0, 1.0);
    dens = dens * dens * (0.35 + 1.25 * uTurbAmp);

    // temperature profile T ∝ r^-3/4, relativistically shifted below
    float temp = uDiskTemp * pow(uDiskInner / rr, 0.75);

    // Keplerian orbital speed β = sqrt(rs / 2r), tangential direction
    float beta2 = clamp(uRS / (2.0 * rr), 0.0, 0.45);
    float beta  = sqrt(beta2);
    vec3 ephi  = normalize(vec3(-hit.z, 0.0, hit.x));
    vec3 toCam = normalize(uCamPos - hit);
    float cosA = dot(ephi, toCam);

    // combined relativistic g-factor: gravitational + transverse + Doppler
    float gGrav = sqrt(max(1.0 - uRS / rr, 0.0));
    float gDop  = sqrt(max(1.0 - beta2, 0.0)) / max(1.0 - beta * cosA, 0.05);
    float g = mix(1.0, gGrav, clamp(uRedshift * 0.5, 0.0, 1.0))
            * mix(1.0, gDop,  clamp(uDoppler  * 0.5, 0.0, 1.0));

    float edgeIn  = smoothstep(uDiskInner, uDiskInner * 1.30, rr);
    float edgeOut = 1.0 - smoothstep(uDiskOuter * 0.70, uDiskOuter, rr);

    vec3 col = blackbody(clamp(temp * g, 0.03, 2.6))
             * uDiskBright * pow(g, 3.0) * (0.30 + dens * 1.6);
    float alpha = clamp(smoothstep(0.06, 0.55, dens) * edgeIn * edgeOut * uDiskOpacity, 0.0, 1.0);
    return vec4(col * edgeIn * edgeOut, alpha);
}

vec3 heatRamp(float t) {
    return mix(mix(vec3(0.05, 0.05, 0.35), vec3(0.95, 0.35, 0.05), smoothstep(0.0, 0.6, t)),
               vec3(1.0, 1.0, 0.9), smoothstep(0.6, 1.0, t));
}

// ------------------------------------------------------------------- main --
void main() {
    float aspect = uRes.x / uRes.y;
    vec2 ndc = vUv * 2.0 - 1.0;
    vec3 rd = normalize(uCamBasis * vec3(ndc.x * uTanHalfFov * aspect,
                                         ndc.y * uTanHalfFov, 1.0));
    vec3 ro = uCamPos;

    // conserved specific angular momentum of the null geodesic
    float h2 = dot(cross(ro, rd), cross(ro, rd));

    vec3 p = ro, v = rd, op = ro;
    vec3 col = vec3(0.0);
    float alpha = 0.0;
    float minR  = length(ro);
    int crossings = 0;
    float lastG = 1.0;
    bool captured = false;
    int i = 0;

    for (i = 0; i < 480; i++) {
        if (i >= uSteps) break;
        float r2 = dot(p, p);
        float r  = sqrt(r2);
        minR = min(minR, r);
        if (r < uRS * 1.001) { captured = true; break; }
        if (r > uFar) break;

        // adaptive step: finer near the horizon / photon sphere
        float dt = min(0.55 * clamp(r - uRS, 0.045, 0.9), 0.30);

        // exact central acceleration of the Schwarzschild orbit equation
        vec3 a = p * (-1.5 * uRS * h2 / (r2 * r2 * r));
        v += a * dt;
        p += v * dt;

        // equatorial disk crossing (multiple crossings occur naturally
        // for strongly lensed rays)
        if (p.y * op.y < 0.0) {
            float t = op.y / (op.y - p.y);
            vec3 hit = mix(op, p, t);
            float rr = length(hit.xz);
            if (rr > uDiskInner && rr < uDiskOuter) {
                vec4 ds = diskSample(hit, rr);
                float gr = sqrt(max(1.0 - uRS / rr, 0.0));
                lastG = gr;
                col += (1.0 - alpha) * ds.rgb * ds.a;
                alpha += (1.0 - alpha) * ds.a;
                crossings++;
            }
        }
        op = p;
        if (alpha > 0.985) break;
    }

    vec3 bg = vec3(0.0);
    if (!captured) {
        bg = background(normalize(v));
        col += (1.0 - alpha) * bg;
        // photon-ring glow: thin bright ring from rays that skimmed
        // the photon sphere at r = 1.5 rs
        float pr = exp(-max(minR - 1.5 * uRS, 0.0) * 5.0);
        col += pr * vec3(1.15, 0.72, 0.42) * 0.22 * (1.0 - alpha);
    }
    // captured rays: col stays as-is minus nothing — the horizon is black.
    if (captured) col *= 1.0; // disk light accumulated in front remains

    // ------------------------------------------------------ debug views --
    if (uDebug == 2) { fragColor = vec4(heatRamp(float(i) / float(uSteps)), 1.0); return; }
    if (uDebug == 3) { fragColor = vec4(captured ? vec3(1.0, 0.15, 0.1) : vec3(0.02), 1.0); return; }
    if (uDebug == 4) { fragColor = vec4(heatRamp(clamp(float(crossings) / 3.0, 0.0, 1.0)), 1.0); return; }
    if (uDebug == 5) { fragColor = vec4(heatRamp(clamp((lastG - 0.4) / 0.6, 0.0, 1.0)), 1.0); return; }
    if (uDebug == 6) { fragColor = vec4(bg, 1.0); return; }
    if (uDebug == 7) { fragColor = vec4(col - (1.0 - alpha) * bg, 1.0); return; }
    if (uDebug == 9) { fragColor = vec4(heatRamp(clamp((minR - uRS) / (6.0 * uRS), 0.0, 1.0)), 1.0); return; }

    fragColor = vec4(col, 1.0);
}
`;

// ----------------------------------------------------------------------------
// POST — threshold (bloom extract), separable gaussian blur, final composite.
// ----------------------------------------------------------------------------
const THRESHOLD_FRAG = /* glsl */ `
precision highp float;
in vec2 vUv;
out vec4 fragColor;
uniform sampler2D tInput;
uniform float uThreshold;
void main() {
    vec3 c = texture(tInput, vUv).rgb;
    float l = max(c.r, max(c.g, c.b));
    float k = clamp(l - uThreshold, 0.0, 8.0) / max(l, 1e-4);
    fragColor = vec4(c * k, 1.0);
}
`;

const BLUR_FRAG = /* glsl */ `
precision highp float;
in vec2 vUv;
out vec4 fragColor;
uniform sampler2D tInput;
uniform vec2 uDir;      // (1/w, 0) or (0, 1/h)
void main() {
    vec3 s = texture(tInput, vUv).rgb * 0.2270270270;
    vec2 o1 = uDir * 1.3846153846;
    vec2 o2 = uDir * 3.2307692308;
    s += (texture(tInput, vUv + o1).rgb + texture(tInput, vUv - o1).rgb) * 0.3162162162;
    s += (texture(tInput, vUv + o2).rgb + texture(tInput, vUv - o2).rgb) * 0.0702702703;
    fragColor = vec4(s, 1.0);
}
`;

const COMPOSITE_FRAG = /* glsl */ `
precision highp float;
in vec2 vUv;
out vec4 fragColor;

uniform sampler2D tScene;
uniform sampler2D tBloomA;
uniform sampler2D tBloomB;
uniform sampler2D tBloomC;
uniform float uBloom;
uniform float uExposure;
uniform float uVignette;
uniform float uGrain;
uniform float uCA;
uniform float uTime;
uniform vec2  uRes;
uniform int   uDebug;

vec3 aces(vec3 x) {
    return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0);
}
float hash12(vec2 p) {
    vec3 p3 = fract(vec3(p.xyx) * 0.1031);
    p3 += dot(p3, p3.yzx + 33.33);
    return fract((p3.x + p3.y) * p3.z);
}
vec3 toSRGB(vec3 c) {
    vec3 lo = c * 12.92;
    vec3 hi = 1.055 * pow(c, vec3(1.0 / 2.4)) - 0.055;
    return mix(lo, hi, step(0.0031308, c));
}

void main() {
    vec2 uv = vUv;

    // debug 2..7, 9: show the raw (already LDR) main-pass output untouched
    if (uDebug >= 2 && uDebug != 8) {
        fragColor = vec4(toSRGB(clamp(texture(tScene, uv).rgb, 0.0, 1.0)), 1.0);
        return;
    }

    vec3 bloom = texture(tBloomA, uv).rgb * 0.5
               + texture(tBloomB, uv).rgb * 0.35
               + texture(tBloomC, uv).rgb * 0.25;

    if (uDebug == 8) {
        fragColor = vec4(toSRGB(aces(bloom * 2.0)), 1.0);
        return;
    }

    // slight chromatic aberration, radial, stronger at edges
    vec2 d = uv - 0.5;
    float l2 = dot(d, d);
    vec2 off = d * l2 * uCA * 0.022;
    vec3 scene;
    scene.r = texture(tScene, uv + off).r;
    scene.g = texture(tScene, uv).g;
    scene.b = texture(tScene, uv - off).b;

    vec3 col = scene + bloom * uBloom;
    if (uDebug != 1) col *= uExposure;

    col = aces(col);

    // vignette
    float vig = 1.0 - uVignette * smoothstep(0.15, 1.15, l2 * 2.4);
    col *= vig;

    // animated film grain
    float g = hash12(uv * uRes + fract(uTime * vec2(13.7, 71.3)) * 961.0) - 0.5;
    col += g * uGrain * (0.35 + 0.65 * (1.0 - clamp(dot(col, vec3(0.333)), 0.0, 1.0)));

    fragColor = vec4(toSRGB(clamp(col, 0.0, 1.0)), 1.0);
}
`;


// === post ===
// ============================================================================
// GARGANTUA — HDR post pipeline: threshold → 3-level gaussian pyramid bloom
// → composite (chromatic aberration, ACES, vignette, grain, sRGB).
// ============================================================================

function makeRT(w, h, depthBuffer = false) {
    return new THREE.WebGLRenderTarget(Math.max(1, w | 0), Math.max(1, h | 0), {
        type: THREE.HalfFloatType,
        format: THREE.RGBAFormat,
        colorSpace: THREE.NoColorSpace,
        depthBuffer,
        stencilBuffer: false,
        minFilter: THREE.LinearFilter,
        magFilter: THREE.LinearFilter,
    });
}

function fullscreenTriangle() {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(
        new Float32Array([-1, -1, 0, 3, -1, 0, -1, 3, 0]), 3));
    return g;
}

class PostPipeline {
    constructor(renderer) {
        this.renderer = renderer;
        this.quadScene = new THREE.Scene();
        this.quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.geo = fullscreenTriangle();

        this.mainUniforms = {
            uRes: { value: new THREE.Vector2(1, 1) },
            uTime: { value: 0 },
            uCamPos: { value: new THREE.Vector3(0, 0, 6.5) },
            uCamBasis: { value: new THREE.Matrix3() },
            uTanHalfFov: { value: Math.tan(55 * Math.PI / 360) },
            uRS: { value: 1.0 },
            uSteps: { value: 224 },
            uFar: { value: 30.0 },
            uDebug: { value: 0 },
            uDiskInner: { value: 2.6 }, uDiskOuter: { value: 7.0 },
            uDiskBright: { value: 1.6 }, uDiskOpacity: { value: 1.0 },
            uDiskTemp: { value: 1.1 },
            uTurbAmp: { value: 1.0 }, uTurbSpeed: { value: 0.6 },
            uDoppler: { value: 1.0 }, uRedshift: { value: 1.0 },
            uStarBright: { value: 1.2 }, uGalaxyBright: { value: 1.0 },
        };
        this.mainMat = new THREE.ShaderMaterial({
            glslVersion: THREE.GLSL3,
            vertexShader: VERT,
            fragmentShader: MAIN_FRAG,
            uniforms: this.mainUniforms,
            depthTest: false,
            depthWrite: false,
        });

        this.thresholdUniforms = {
            tInput: { value: null }, uThreshold: { value: 1.0 },
        };
        this.thresholdMat = new THREE.ShaderMaterial({
            glslVersion: THREE.GLSL3, vertexShader: VERT,
            fragmentShader: THRESHOLD_FRAG, uniforms: this.thresholdUniforms,
            depthTest: false, depthWrite: false,
        });

        this.blurUniforms = {
            tInput: { value: null }, uDir: { value: new THREE.Vector2(1, 0) },
        };
        this.blurMat = new THREE.ShaderMaterial({
            glslVersion: THREE.GLSL3, vertexShader: VERT,
            fragmentShader: BLUR_FRAG, uniforms: this.blurUniforms,
            depthTest: false, depthWrite: false,
        });

        this.compositeUniforms = {
            tScene: { value: null },
            tBloomA: { value: null }, tBloomB: { value: null }, tBloomC: { value: null },
            uBloom: { value: 0.85 }, uExposure: { value: 1.15 },
            uVignette: { value: 0.35 }, uGrain: { value: 0.06 },
            uCA: { value: 0.6 }, uTime: { value: 0 },
            uRes: { value: new THREE.Vector2(1, 1) },
            uDebug: { value: 0 },
        };
        this.compositeMat = new THREE.ShaderMaterial({
            glslVersion: THREE.GLSL3, vertexShader: VERT,
            fragmentShader: COMPOSITE_FRAG, uniforms: this.compositeUniforms,
            depthTest: false, depthWrite: false,
        });

        this.quad = new THREE.Mesh(this.geo, this.mainMat);
        this.quadScene.add(this.quad);

        this.rtScene = null;
        this.bloom = [];   // [{a, b}] per level
        this.setSize(2, 2);
    }

    setSize(w, h) {
        this.width = w; this.height = h;
        this.rtScene?.dispose();
        this.bloom.forEach(l => { l.a.dispose(); l.b.dispose(); });
        this.rtScene = makeRT(w, h, true);   // depthBuffer 用于 3D 飞船合成
        this.bloom = [];
        for (let i = 0; i < 3; i++) {
            const bw = Math.max(1, w >> (i + 1)), bh = Math.max(1, h >> (i + 1));
            this.bloom.push({ a: makeRT(bw, bh), b: makeRT(bw, bh), w: bw, h: bh });
        }
        this.mainUniforms.uRes.value.set(w, h);
        this.compositeUniforms.uRes.value.set(w, h);
    }

    _pass(material, target) {
        this.quad.material = material;
        this.renderer.setRenderTarget(target);
        this.renderer.render(this.quadScene, this.quadCam);
    }

    render(extraRenderer) {
        const r = this.renderer;
        const oldRT = r.getRenderTarget();

        // 1. main raytrace pass → HDR target
        this._pass(this.mainMat, this.rtScene);

        // 1.5. 可选：把额外 3D 场景（飞船）合成进 HDR 场景缓冲
        if (extraRenderer) extraRenderer(this.rtScene);

        // 2. bloom pyramid: threshold into level 0, then blur chain
        this.thresholdUniforms.tInput.value = this.rtScene.texture;
        this._pass(this.thresholdMat, this.bloom[0].a);
        let src = this.bloom[0].a;
        for (let i = 0; i < this.bloom.length; i++) {
            const lvl = this.bloom[i];
            if (i > 0) {  // downsample previous level result into this level
                this.blurUniforms.tInput.value = src.texture;
                this.blurUniforms.uDir.value.set(0, 0); // pure copy pass
                this._pass(this.blurMat, lvl.a);
                src = lvl.a;
            }
            this.blurUniforms.tInput.value = lvl.a.texture;
            this.blurUniforms.uDir.value.set(1 / lvl.w, 0);
            this._pass(this.blurMat, lvl.b);
            this.blurUniforms.tInput.value = lvl.b.texture;
            this.blurUniforms.uDir.value.set(0, 1 / lvl.h);
            this._pass(this.blurMat, lvl.a);
        }

        // 3. composite to screen
        const cu = this.compositeUniforms;
        cu.tScene.value = this.rtScene.texture;
        cu.tBloomA.value = this.bloom[0].a.texture;
        cu.tBloomB.value = this.bloom[1].a.texture;
        cu.tBloomC.value = this.bloom[2].a.texture;
        cu.uDebug.value = this.mainUniforms.uDebug.value;
        cu.uTime.value = this.mainUniforms.uTime.value;
        this._pass(this.compositeMat, null);

        r.setRenderTarget(oldRT);
    }

    dispose() {
        this.rtScene?.dispose();
        this.bloom.forEach(l => { l.a.dispose(); l.b.dispose(); });
        [this.mainMat, this.thresholdMat, this.blurMat, this.compositeMat]
            .forEach(m => m.dispose());
        this.geo.dispose();
    }
}

    { name: '2 · 极区俯瞰', camDistance: 7.5, inclination: 14, fov: 50, exposure: 1.20 },
    { name: '3 · 光子环',   camDistance: 3.4, inclination: 90, fov: 42, exposure: 1.05 },
    { name: '4 · 深场广角', camDistance: 13.0, inclination: 55, fov: 48, exposure: 1.25 },
];

// 视觉效果最佳预设：调低恒星/银河、调高辉光与阈值、暗角加重、胶片颗粒归零
const BEST_PRESET = {
    starBrightness:   0.80,   // 恒星亮度略低
    galaxyBrightness: 0.70,   // 银河亮度略低
    bloomStrength:    1.10,   // 辉光略强
    bloomThreshold:   1.30,   // 阈值略高，让暗部不 bloom
    vignette:         0.55,   // 暗角加重
    grain:            0.00,   // 胶片颗粒归零
    chromatic:        0.35,   // 色散略降（更干净）
    exposure:         1.25,   // 曝光略提
    diskBrightness:   2.10,   // 吸积盘稍亮
    doppler:          1.10,   // 多普勒稍强
    redshift:         1.05,   // 红移稍强
};

const MOBILE_CAMERA = (() => {
    const w = innerWidth, h = innerHeight;
    const portrait = h > w;
    const small = Math.min(w, h) < 480;
    if (portrait) {
        return { camDistance: small ? 9.5 : 8.5, inclination: 72, fov: small ? 48 : 52 };
    }
    return { camDistance: 7.0, inclination: 76, fov: 55 };
})();

const STORE_KEY = 'gargantua-v2';
const isMobile = matchMedia('(pointer: coarse)').matches || innerWidth < 720;

// ------------------------------------------------------------- global state
window.__errors = [];
window.addEventListener('error', e => window.__errors.push(String(e.message || e)));
window.addEventListener('unhandledrejection', e => window.__errors.push('rejection: ' + String(e.reason)));

const state = {
    params: {},
    quality: 'high',
    debug: 0,
    cinematic: false,
    paused: false,
    music: false,
    azimuth: 0.6,
    simTime: 4.0,
    shot: null,
};
for (const [k, , , , , def] of PARAM_DEFS) state.params[k] = def;

// ------------------------------------------------------------ URL API parse
{
    const q = new URLSearchParams(location.search);
    if (q.get('fresh')) try { localStorage.removeItem(STORE_KEY); } catch (_) {}
    if (q.get('shot')) {
        state.shot = {
            w: parseInt(q.get('w') || '960', 10),
            h: parseInt(q.get('h') || '540', 10),
            t: parseFloat(q.get('t') || '4.0'),
            hud: q.get('hud') !== '0',
            dl: q.get('dl') === '1',
        };
        state.cinematic = false;
        state.simTime = state.shot.t;
        state.paused = true;
        state.music = false;
    }
    if (q.get('q') && QUALITY[q.get('q')]) state.quality = q.get('q');
    if (q.get('preset')) {
        const i = Math.min(3, Math.max(0, parseInt(q.get('preset'), 10) - 1));
        Object.assign(state.params, PRESETS[i]);
    }
}

// --------------------------------------------------------------- persistence
function save() {
    try {
        localStorage.setItem(STORE_KEY, JSON.stringify({
            params: state.params, quality: state.quality,
            debug: state.debug, music: state.music, azimuth: state.azimuth,
        }));
    } catch (_) { /* storage unavailable */ }
}
function load() {
    if (state.shot) return;            // URL API wins over stored state
    try {
        const s = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
        if (!s) return;
        if (s.params) for (const k of Object.keys(state.params)) {
            if (typeof s.params[k] === 'number') state.params[k] = s.params[k];
        }
        if (QUALITY[s.quality]) state.quality = s.quality;
        if (typeof s.debug === 'number') state.debug = s.debug;
        if (typeof s.azimuth === 'number') state.azimuth = s.azimuth;
        state.music = !!s.music;
    } catch (_) { /* corrupted state */ }
}
load();

// --------------------------------------------------------------------- DOM
const $ = id => document.getElementById(id);
const canvas = $('gl');

function showOverlay(msg, sticky = false) {
    const o = $('overlay');
    o.textContent = msg;
    o.classList.add('visible');
    if (!sticky) setTimeout(() => o.classList.remove('visible'), 2600);
}
function toast(msg) { showOverlay(msg, false); }

// ------------------------------------------------------------------ renderer
let renderer = null, pipeline = null, controls = null, camera = null;
let rafId = 0, contextLost = false;

function createRenderer() {
    try {
        renderer = new THREE.WebGLRenderer({
            canvas, antialias: false, alpha: false,
            powerPreference: 'high-performance',
            preserveDrawingBuffer: true,   // required for the screenshot API
        });
    } catch (err) {
        window.__errors.push('WebGL init: ' + err.message);
        showOverlay('⚠ WebGL 不可用：' + err.message, true);
        return false;
    }
    renderer.outputColorSpace = THREE.LinearSRGBColorSpace; // manual sRGB in shader
    renderer.toneMapping = THREE.NoToneMapping;
    return true;
}

function initGL() {
    pipeline?.dispose();
    pipeline = new PostPipeline(renderer);
    applyQuality(state.quality, true);
    syncUniforms();
}

function renderSize() {
    const q = QUALITY[state.quality];
    const dpr = Math.min(devicePixelRatio || 1, q.dprCap) * q.scale;
    let w = Math.max(2, Math.round(innerWidth * dpr));
    let h = Math.max(2, Math.round(innerHeight * dpr));
    if (state.shot) { w = state.shot.w; h = state.shot.h; }
    return { w, h };
}

function applyQuality(name, force = false) {
    if (!QUALITY[name]) name = 'standard';
    state.quality = name;
    const { w, h } = renderSize();
    renderer.setSize(w, h, false);
    canvas.style.width = '100vw';
    canvas.style.height = '100vh';
    pipeline.setSize(w, h);
    pipeline.mainUniforms.uSteps.value = QUALITY[name].steps;
    document.querySelectorAll('#quality button').forEach(b =>
        b.classList.toggle('active', b.dataset.q === name));
    if (!force) save();
}

// ------------------------------------------------------------------- camera
function setupCamera() {
    camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.01, 100);
    controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.minDistance = 2.9;
    controls.maxDistance = 18;
    controls.target.set(0, 0, 0);
    controls.addEventListener('start', () => {
        if (state.cinematic) { state.cinematic = false; toast('电影运镜：关'); }
    });
    controls.addEventListener('change', () => {
        // sync spherical params back from user orbiting
        const p = camera.position;
        const d = p.length();
        state.params.camDistance = +d.toFixed(2);
        state.params.inclination = +((Math.acos(THREE.MathUtils.clamp(p.y / d, -1, 1)) * 180 / Math.PI)).toFixed(1);
        state.azimuth = Math.atan2(p.z, p.x);
        refreshPanelValues();
    });
    applyCameraFromParams();
}

function applyCameraFromParams() {
    const d = state.params.camDistance;
    const inc = state.params.inclination * Math.PI / 180;
    const az = state.azimuth;
    camera.position.set(
        d * Math.sin(inc) * Math.cos(az),
        d * Math.cos(inc),
        d * Math.sin(inc) * Math.sin(az));
    camera.lookAt(0, 0, 0);
    controls.update();
}

function updateCinematic(t) {
    const baseD = isMobile ? (innerHeight > innerWidth ? 9.0 : 6.5) : 6.3;
    const d = baseD + 1.7 * Math.sin(0.13 * t);
    const inc = (76 + 15 * Math.sin(0.09 * t + 1.7)) * Math.PI / 180;
    const az = state.azimuth + 0.11 * t;
    camera.position.set(
        d * Math.sin(inc) * Math.cos(az),
        d * Math.cos(inc),
        d * Math.sin(inc) * Math.sin(az));
    camera.lookAt(0, 0, 0);
}

const _v = { right: new THREE.Vector3(), up: new THREE.Vector3(), fwd: new THREE.Vector3() };
function syncUniforms() {
    if (!pipeline) return;
    const u = pipeline.mainUniforms, p = state.params;
    camera.fov = p.fov; camera.updateProjectionMatrix();
    u.uTanHalfFov.value = Math.tan(p.fov * Math.PI / 360);
    u.uCamPos.value.copy(camera.position);
    camera.getWorldDirection(_v.fwd).normalize();
    _v.right.crossVectors(_v.fwd, camera.up).normalize();
    _v.up.crossVectors(_v.right, _v.fwd).normalize();
    u.uCamBasis.value.set(
        _v.right.x, _v.up.x, _v.fwd.x,
        _v.right.y, _v.up.y, _v.fwd.y,
        _v.right.z, _v.up.z, _v.fwd.z);
    for (const [key, , , , , , uni] of PARAM_DEFS) if (uni && u[uni]) u[uni].value = p[key];
    u.uDebug.value = state.debug;
    const c = pipeline.compositeUniforms;
    c.uBloom.value = p.bloomStrength;
    c.uExposure.value = p.exposure;
    c.uVignette.value = p.vignette;
    c.uGrain.value = p.grain;
    c.uCA.value = p.chromatic;
    pipeline.thresholdUniforms.uThreshold.value = p.bloomThreshold;
}

// ---------------------------------------------------------------------- HUD
function buildPanel() {
    const wrap = $('params');
    wrap.innerHTML = '';
    for (const [key, label, min, max, step] of PARAM_DEFS) {
        const row = document.createElement('div');
        row.className = 'param';
        const lab = document.createElement('label');
        lab.textContent = label;
        lab.htmlFor = 'p_' + key;
        const val = document.createElement('span');
        val.className = 'val';
        val.id = 'v_' + key;
        const input = document.createElement('input');
        input.type = 'range'; input.id = 'p_' + key;
        input.min = min; input.max = max; input.step = step;
        input.value = state.params[key];
        input.addEventListener('input', () => {
            state.params[key] = parseFloat(input.value);
            val.textContent = (+state.params[key]).toFixed(2);
            if (key === 'camDistance' || key === 'inclination') {
                state.cinematic = false;
                applyCameraFromParams();
            }
            save();
        });
        row.append(lab, val, input);
        wrap.appendChild(row);
    }
    refreshPanelValues();
}

function refreshPanelValues() {
    for (const [key] of PARAM_DEFS) {
        const input = $('p_' + key), val = $('v_' + key);
        if (!input) continue;
        input.value = state.params[key];
        val.textContent = (+state.params[key]).toFixed(2);
    }
}

function resetParams() {
    for (const [k, , , , , def] of PARAM_DEFS) state.params[k] = def;
    refreshPanelValues();
    applyCameraFromParams();
    save();
    toast('参数已重置');
}

function applyPreset(i) {
    Object.assign(state.params, PRESETS[i]);
    state.cinematic = false;
    refreshPanelValues();
    applyCameraFromParams();
    save();
    toast('视角预设：' + PRESETS[i].name);
}

function applyBestPreset() {
    Object.assign(state.params, BEST_PRESET);
    refreshPanelValues();
    syncUniforms();
    save();
    toast('★ 最佳预设已应用');
}

// --------------------------------------------------------------------- audio
let audioEl = null, synthCtx = null, synthNodes = null;
function musicOn() {
    state.music = true;
    startSynth();
    updateMusicButton();
    save();
}
function musicOff() {
    state.music = false;
    audioEl?.pause();
    stopSynth();
    updateMusicButton();
    save();
}
function startSynth() {
    try {
        synthCtx = synthCtx || new (window.AudioContext || window.webkitAudioContext)();
        const ctx = synthCtx;
        const master = ctx.createGain(); master.gain.value = 0.12;
        master.connect(ctx.destination);
        synthNodes = [master];
        [55, 82.41, 110.2, 164.8].forEach((f, i) => {
            const o = ctx.createOscillator();
            o.type = i < 2 ? 'sine' : 'triangle';
            o.frequency.value = f;
            const g = ctx.createGain(); g.gain.value = 0.6 / (i + 1);
            const lfo = ctx.createOscillator(); lfo.frequency.value = 0.05 + i * 0.017;
            const lg = ctx.createGain(); lg.gain.value = 0.25 / (i + 1);
            lfo.connect(lg); lg.connect(g.gain);
            o.connect(g); g.connect(master);
            o.start(); lfo.start();
            synthNodes.push(o, lfo, g, lg);
        });
    } catch (e) { window.__errors.push('audio: ' + e.message); }
}
function stopSynth() {
    if (!synthNodes) return;
    synthNodes.forEach(n => { try { n.stop?.(); n.disconnect(); } catch (_) {} });
    synthNodes = null;
}
function updateMusicButton() {
    $('musicBtn').textContent = state.music ? '♪ 音乐：开' : '♪ 音乐：关';
    $('musicBtn').classList.toggle('active', state.music);
}

// --------------------------------------------------------------- screenshot
function captureDataURL() {
    pipeline.render();
    return renderer.domElement.toDataURL('image/png');
}
function downloadPNG() {
    const a = document.createElement('a');
    a.href = captureDataURL();
    a.download = 'gargantua-' + Date.now() + '.png';
    a.click();
    toast('截图已保存');
}
window.GARGANTUA = {
    capture: () => captureDataURL(),
    setParam: (k, v) => {
        if (k in state.params) { state.params[k] = +v; refreshPanelValues(); save(); }
    },
    setQuality: q => applyQuality(q),
    setDebug: d => { state.debug = d | 0; },
    errors: window.__errors,
};

// ------------------------------------------------------------------ hotkeys
function onKey(e) {
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
    const k = e.key;
    if (e.shiftKey && k >= '1' && k <= '4') { applyPreset(+k - 1); return; }
    if (k >= '0' && k <= '9') {
        state.debug = +k;
        $('debugLabel').textContent = '调试 ' + state.debug;
        toast('调试视图 ' + k);
        save();
        return;
    }
    switch (k.toLowerCase()) {
        case 'c': state.cinematic = !state.cinematic; toast('电影运镜：' + (state.cinematic ? '开' : '关')); break;
        case 'h': document.body.classList.toggle('ui-hidden'); break;
        case 'f':
            if (document.fullscreenElement) document.exitFullscreen();
            else document.documentElement.requestFullscreen().catch(() => {});
            break;
        case 'p': downloadPNG(); break;
        case 'm': state.music ? musicOff() : musicOn(); break;
        case 'r': resetParams(); break;
        case 'b': applyBestPreset(); break;
        case 'q': {
            const keys = Object.keys(QUALITY);
            applyQuality(keys[(keys.indexOf(state.quality) + 1) % keys.length]);
            toast('画质：' + QUALITY[state.quality].label);
            break;
        }
        case ' ': state.paused = !state.paused; toast(state.paused ? '时间已暂停' : '时间继续'); e.preventDefault(); break;
    }
}

// ------------------------------------------------------------------ main loop
let lastT = performance.now(), fpsEMA = 60, frames = 0, shotFrames = 0;
let autoDropped = false, slowTime = 0;

function tick(now) {
    rafId = requestAnimationFrame(tick);
    const dt = Math.min((now - lastT) / 1000, 0.1);
    lastT = now;
    if (dt > 0) fpsEMA = fpsEMA * 0.95 + (1 / dt) * 0.05;

    if (!state.paused) state.simTime += dt * state.params.timeScale;
    if (state.cinematic) updateCinematic(state.simTime);
    else controls.update();

    pipeline.mainUniforms.uTime.value = state.simTime;
    syncUniforms();

    pipeline.render();

    // stats (4 Hz refresh)
    if ((frames++ & 15) === 0) {
        $('fps').textContent = fpsEMA.toFixed(0);
        $('res').textContent = pipeline.width + '×' + pipeline.height;
        $('steps').textContent = pipeline.mainUniforms.uSteps.value;
        $('qual').textContent = QUALITY[state.quality].label;
        $('debugLabel').textContent = '调试 ' + state.debug;
    }

    // adaptive quality: drop one tier if sustained < 24 fps
    if (!autoDropped && !state.shot && now > 6000) {
        if (fpsEMA < 24) slowTime += dt; else slowTime = 0;
        if (slowTime > 4) {
            autoDropped = true;
            if (state.quality === 'cinematic') { applyQuality('high'); toast('画质自动调整 → 高清'); }
            else if (state.quality === 'high') { applyQuality('standard'); toast('画质自动调整 → 标准'); }
        }
    }

    // URL screenshot automation: settle a few frames, then signal ready
    if (state.shot && ++shotFrames === 8) {
        window.__SHOT_DATAURL = captureDataURL();
        window.__SHOT_READY = true;
        if (state.shot.dl) downloadPNG();
    }

    // machine-readable diagnostics for automated acceptance tests
    if ((frames & 31) === 0 || window.__SHOT_READY) {
        $('diag').textContent = JSON.stringify({
            booted: !!window.__BOOTED,
            ready: !!window.__SHOT_READY,
            shotDataURLLen: (window.__SHOT_DATAURL || '').length,
            fps: +fpsEMA.toFixed(1),
            res: pipeline.width + 'x' + pipeline.height,
            steps: pipeline.mainUniforms.uSteps.value,
            quality: state.quality,
            errors: window.__errors,
        });
    }
}

// ------------------------------------------------------------- context loss
function onContextLost(e) {
    e.preventDefault();
    contextLost = true;
    cancelAnimationFrame(rafId);
    showOverlay('⚠ WebGL 上下文丢失 — 正在尝试恢复…', true);
    window.__errors.push('webglcontextlost');
}
function onContextRestored() {
    contextLost = false;
    $('overlay').classList.remove('visible');
    initGL();
    lastT = performance.now();
    rafId = requestAnimationFrame(tick);
    toast('WebGL 上下文已恢复');
}

// --------------------------------------------------------------------- boot
function boot() {
    if (!createRenderer()) return;
    canvas.addEventListener('webglcontextlost', onContextLost);
    canvas.addEventListener('webglcontextrestored', onContextRestored);

    buildPanel();
    setupCamera();
    initGL();
    updateMusicButton();

    if (state.shot) $('diag').hidden = false;   // machine-readable acceptance probe
    if (state.shot && !state.shot.hud) document.body.classList.add('ui-hidden');

    // quality buttons
    document.querySelectorAll('#quality button').forEach(b =>
        b.addEventListener('click', () => { applyQuality(b.dataset.q); save(); }));
    // preset buttons
    document.querySelectorAll('#presets button').forEach((b, i) =>
        b.addEventListener('click', () => applyPreset(i)));
    $('musicBtn').addEventListener('click', () => state.music ? musicOff() : musicOn());
    $('resetBtn').addEventListener('click', resetParams);
    $('shotBtn').addEventListener('click', downloadPNG);
    $('cineBtn').addEventListener('click', () => { state.cinematic = !state.cinematic; });

    // 最佳预设按钮
    const bestBtn = $('bestBtn');
    if (bestBtn) bestBtn.addEventListener('click', applyBestPreset);

    addEventListener('keydown', onKey);
    addEventListener('resize', () => {
        applyQuality(state.quality, true);
    });
    addEventListener('beforeunload', save);

    if (state.music) { /* will actually start on first user gesture */ }
    rafId = requestAnimationFrame(tick);
    window.__BOOTED = true;
}

try {
    boot();
} catch (err) {
    window.__errors.push('boot: ' + (err.stack || err.message));
    showOverlay('⚠ 启动失败：' + err.message, true);
    throw err;
}



// 启动后通知 UI (仅当 boot 成功时)
requestAnimationFrame(() => setTimeout(() => {
    if (window.__BOOTED && window.__bootReady) window.__bootReady();
}, 120));
</script>
</body>
</html>
