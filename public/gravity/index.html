<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>万有引力 · 黑洞 GARGANTUA</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='9' fill='black' stroke='orange' stroke-width='3'/></svg>">
<style>
:root {
    --accent: #ffa94d;
    --fg: #e8e4da;
    --bg: rgba(8, 8, 12, 0.78);
    --border: rgba(255, 169, 77, 0.22);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
body {
    font-family: "PingFang SC", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    color: var(--fg);
    -webkit-user-select: none; user-select: none;
    touch-action: none;
}
#gl { position: fixed; inset: 0; display: block; width: 100vw; height: 100vh; touch-action: none; }

/* ---------- 顶部标题 (极简, 自动半透明) ---------- */
#hud-top {
    position: fixed; top: max(12px, env(safe-area-inset-top)); left: 16px; z-index: 5;
    text-shadow: 0 1px 6px #000; pointer-events: none;
    transition: opacity .4s;
}
#hud-top h1 {
    font-size: 18px; letter-spacing: 0.32em; font-weight: 300; color: var(--accent);
}
#hud-top .sub { font-size: 9px; letter-spacing: 0.18em; opacity: 0.65; margin-top: 2px; }
#hud-top .stats { font-size: 9px; font-variant-numeric: tabular-nums; opacity: 0.55; margin-top: 5px; }

/* ---------- 底部控制 dock (玻璃质感, 可折叠) ---------- */
#dock {
    position: fixed; left: 50%; bottom: calc(54px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%); z-index: 6;
    width: min(94vw, 520px);
    background: linear-gradient(180deg, rgba(8,8,12,0.6), rgba(8,8,12,0.88));
    backdrop-filter: blur(14px) saturate(140%); -webkit-backdrop-filter: blur(14px) saturate(140%);
    border: 1px solid var(--border); border-radius: 16px;
    padding: 9px 11px 11px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.04);
    transition: opacity .35s, transform .35s cubic-bezier(0.22, 1, 0.36, 1);
}
#dock.collapsed { opacity: 0; transform: translateX(-50%) translateY(24px) scale(0.96); pointer-events: none; }

.dock-row { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
.dock-row + .dock-row { margin-top: 6px; padding-top: 6px; border-top: 1px solid rgba(255,169,77,0.1); }
.dock-label {
    font-size: 8px; letter-spacing: 0.24em; text-transform: uppercase;
    color: var(--accent); opacity: 0.7; margin-right: 3px; font-weight: 600;
    flex: 0 0 auto;
}
button {
    flex: 1 1 auto; min-width: 40px;
    background: rgba(255, 169, 77, 0.07);
    border: 1px solid var(--border);
    color: var(--fg); font-size: 11px; padding: 8px 7px;
    border-radius: 8px; cursor: pointer; white-space: nowrap;
    transition: background .15s, transform .12s;
    touch-action: manipulation;
}
button:hover { background: rgba(255, 169, 77, 0.2); }
button:active { transform: scale(0.92); background: rgba(255, 169, 77, 0.3); }
button.active { background: var(--accent); color: #14100a; font-weight: 700; }
button.primary { background: var(--accent); color: #14100a; font-weight: 700; box-shadow: 0 0 12px rgba(255,169,77,0.3); }
button.primary:hover { background: #ffbf6e; }
button.icon { flex: 0 0 auto; min-width: 38px; padding: 8px 9px; font-size: 13px; }

/* ---------- 折叠按钮 (浮动) ---------- */
#toggle-dock {
    position: fixed; right: 14px;
    bottom: calc(58px + env(safe-area-inset-bottom, 0px)); z-index: 7;
    width: 40px; height: 40px; border-radius: 50%;
    background: rgba(8,8,12,0.78); border: 1px solid var(--border);
    color: var(--accent); font-size: 17px; cursor: pointer;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    display: flex; align-items: center; justify-content: center;
    transition: transform .2s, opacity .3s;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
}
#toggle-dock:active { transform: scale(0.88); }

/* ---------- 底部 TAB 栏 ---------- */
#tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 8;
    height: calc(48px + env(safe-area-inset-bottom, 0px));
    padding: 0 12px env(safe-area-inset-bottom, 0px);
    background: linear-gradient(180deg, rgba(8,8,12,0.7), rgba(0,0,0,0.95));
    backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%);
    border-top: 1px solid rgba(255,169,77,0.16);
    display: flex; align-items: center; gap: 8px;
}
.tab-cat {
    font-size: 10px; letter-spacing: 0.2em; color: var(--accent);
    opacity: 0.85; font-weight: 600; padding: 0 4px; flex: 0 0 auto;
}
.tab-pills { display: flex; gap: 6px; flex: 1 1 auto; overflow-x: auto; scrollbar-width: none; }
.tab-pills::-webkit-scrollbar { display: none; }
.tab-pill {
    flex: 0 0 auto;
    display: inline-flex; align-items: center; gap: 4px;
    padding: 6px 12px; border-radius: 999px;
    background: rgba(255,169,77,0.08); border: 1px solid var(--border);
    color: var(--fg); font-size: 11px; cursor: pointer;
    white-space: nowrap; transition: all .15s; touch-action: manipulation;
}
.tab-pill.active { background: var(--accent); color: #14100a; font-weight: 700; box-shadow: 0 0 10px rgba(255,169,77,0.35); }
.tab-pill:not(.active) { opacity: 0.6; }
.tab-pill:not(.active):active { opacity: 1; background: rgba(255,169,77,0.18); }
.tab-more { font-size: 9px; color: var(--fg); opacity: 0.38; padding: 0 4px; flex: 0 0 auto; font-style: italic; }

/* ---------- toast ---------- */
#overlay {
    position: fixed; left: 50%; bottom: 120px; transform: translateX(-50%);
    z-index: 20; padding: 8px 18px; border-radius: 8px;
    background: var(--bg); border: 1px solid var(--border);
    font-size: 12px; letter-spacing: 0.05em;
    opacity: 0; pointer-events: none; transition: opacity .35s;
    max-width: 80vw; text-align: center;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
#overlay.visible { opacity: 1; }

/* ---------- 隐藏的必要容器 ---------- */
#params, #diag, #ship-modal { display: none !important; }

/* ---------- 沉浸模式 ---------- */
body.ui-hidden #hud-top, body.ui-hidden #dock, body.ui-hidden #toggle-dock { opacity: 0 !important; pointer-events: none; }
body.ui-hidden #tabbar { opacity: 0.3; }
body.ui-hidden #overlay { opacity: 0 !important; }
body:not(.ui-hidden) #hud-top.idle { opacity: 0.35; }

/* ---------- 加载界面 ---------- */
#boot {
    position: fixed; inset: 0; z-index: 100; background: #000;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 16px;
    transition: opacity .7s; color: var(--accent);
}
#boot.done { opacity: 0; pointer-events: none; }
#boot .ring {
    width: 48px; height: 48px; border-radius: 50%;
    border: 2px solid rgba(255,169,77,0.18); border-top-color: var(--accent);
    animation: spin 1s linear infinite;
}
#boot .txt { font-size: 10px; letter-spacing: 0.32em; opacity: 0.6; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- 手机端 ---------- */
@media (max-width: 480px) {
    #hud-top h1 { font-size: 15px; letter-spacing: 0.28em; }
    #hud-top .stats { display: none; }
    #dock { width: 94vw; padding: 8px 9px 10px; }
    button { padding: 9px 5px; font-size: 10px; }
    .dock-label { display: none; }
    #toggle-dock { width: 36px; height: 36px; font-size: 15px; }
    .tab-cat { font-size: 9px; }
    .tab-pill { padding: 5px 10px; font-size: 10px; }
}
@media (max-width: 360px) {
    button { padding: 9px 4px; font-size: 9px; min-width: 36px; }
}
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="boot">
    <div class="ring"></div>
    <div class="txt">GARGANTUA · 引力场计算中</div>
</div>

<header id="hud-top">
    <h1>GARGANTUA</h1>
    <p class="sub">史瓦西黑洞 · 实时光线追踪</p>
    <p class="stats">
        <span id="fps">60</span> 帧 · <span id="res">–</span> ·
        <span id="steps">–</span> 步 · <span id="qual">–</span> ·
        <span id="debugLabel">调试 0</span>
    </p>
</header>

<div id="params" hidden></div>
<div id="diag" hidden></div>
<div id="ship-modal" class="modal hidden"></div>

<div id="dock">
    <div class="dock-row">
        <span class="dock-label">画质</span>
        <div id="quality" style="display:contents">
            <button data-q="standard">标准</button>
            <button data-q="high">高清</button>
            <button data-q="cinematic">影院</button>
        </div>
    </div>
    <div class="dock-row">
        <span class="dock-label">视角</span>
        <div id="presets" style="display:contents">
            <button>视界</button>
            <button>极区</button>
            <button>光子环</button>
            <button>深场</button>
        </div>
    </div>
    <div class="dock-row">
        <button id="bestBtn" class="primary">★ 最佳</button>
        <button id="cineBtn" class="icon" title="电影运镜">🎬</button>
        <button id="musicBtn" class="icon" title="音乐">♪</button>
        <button id="shotBtn" class="icon" title="截图">📷</button>
        <button id="resetBtn" class="icon" title="重置">↺</button>
        <button id="hideBtn" class="icon" title="沉浸">👁</button>
    </div>
</div>

<button id="toggle-dock" title="控制面板">⚙</button>

<nav id="tabbar">
    <span class="tab-cat">🪐 万有引力</span>
    <div class="tab-pills">
        <span class="tab-pill active">🕳️ 黑洞</span>
        <span class="tab-more">更多工具即将上线</span>
    </div>
</nav>

<div id="overlay" role="alert"></div>

<script type="module">
import 'gargantua/main';

// 启动后: 隐藏加载提示 + 自动最佳预设
function bootReady() {
    const boot = document.getElementById('boot');
    if (boot) { boot.classList.add('done'); setTimeout(() => boot.remove(), 800); }
    // 自动应用最佳视觉预设
    const best = document.getElementById('bestBtn');
    if (best) best.click();
    // 移动端稍后自动折叠面板, 专注看宇宙
    if (matchMedia('(pointer: coarse)').matches || innerWidth < 720) {
        setTimeout(() => { if (!dockCollapsed) toggleDockPanel(); }, 1800);
    }
}
requestAnimationFrame(() => setTimeout(bootReady, 100));

// 折叠/展开控制面板
const dock = document.getElementById('dock');
const toggleDock = document.getElementById('toggle-dock');
let dockCollapsed = false;
function toggleDockPanel() {
    dockCollapsed = !dockCollapsed;
    dock.classList.toggle('collapsed', dockCollapsed);
}
toggleDock.addEventListener('click', toggleDockPanel);

// 沉浸模式
const hideBtn = document.getElementById('hideBtn');
if (hideBtn) hideBtn.addEventListener('click', () => document.body.classList.toggle('ui-hidden'));

// 双指缩放/双击切换沉浸 (移动端友好)
let lastTap = 0;
const gl = document.getElementById('gl');
gl.addEventListener('touchend', (e) => {
    const now = Date.now();
    if (now - lastTap < 320 && e.changedTouches.length === 1) {
        document.body.classList.toggle('ui-hidden');
    }
    lastTap = now;
});
gl.addEventListener('dblclick', () => document.body.classList.toggle('ui-hidden'));

// HUD 闲置半透明 (无操作时淡化, 操作时恢复)
const hudTop = document.getElementById('hud-top');
let idleTimer = null;
function markActive() {
    hudTop.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => hudTop.classList.add('idle'), 2500);
}
['touchstart','touchmove','mousedown','wheel'].forEach(ev =>
    document.addEventListener(ev, markActive, { passive: true }));
markActive();
</script>
